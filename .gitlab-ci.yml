stages:
  - generate

generate-profile-cards:
  stage: generate
  image: node:22-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - npm ci
  script:
    - npm run build
    - npm run generate
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci@users.noreply.local"
    - git add "${OUTPUT_DIR:-profile-summary-card-output}"
    - |
      if git diff --cached --quiet; then
        echo "No card changes to commit"
        exit 0
      fi
    - git commit -m "chore: update profile summary cards [skip ci]"
    - TARGET_BRANCH="${CI_DEFAULT_BRANCH:-main}"
    - git push "https://oauth2:${PROFILE_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${TARGET_BRANCH}"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - profile-summary-card-output/
  resource_group: profile-card-generation
